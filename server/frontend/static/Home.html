<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Cars Dealerships</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <script>

    const logout = async (event) => {
      event?.preventDefault();
      //Include the code for logout here.
      // Build logout URL and Make GET request to logout endpoint
      let logout_url = window.location.origin + "/djangoapp/logout";
      const res = await fetch(logout_url, {
        method: "GET",
      });

      const json = await res.json();
      if (json) {
        // Clear session storage and reload page
        let username = sessionStorage.getItem('username');
        sessionStorage.removeItem('username');
        window.location.href = window.location.origin;
        window.location.reload();
        // Notify user of logout
        alert("Logging out " + username + "...")
      }
      else {
        alert("The user could not be logged out.")
      }

    };

    let checkSession = () => {
      let curr_user = sessionStorage.getItem("username");

      if (curr_user && curr_user !== "") {
        document.getElementById("loginlogout").innerHTML =
          '<span class="homepage_links">' + curr_user + '</span>' +
          '<a class="homepage_links" onclick="logout(event)" href="/">Logout</a>'
      } else {
        document.getElementById("loginlogout").innerHTML =
          '<a class="homepage_links" href="/login">Login</a>' +
          '<a class="homepage_links"  href="/register">Register</a>'
      }
    }
  </script>
</head>

<body onload="checkSession()">
  <nav class="navbar navbar-expand-lg navbar-light"
    style="background-color:rgb(232, 245, 237); height: 1in; position: relative; z-index: 1050;">
    <div class="container-fluid">
      <a href="/" class="logo">Dealerships</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" style="font-size: larger;" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" href="/about/">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" href="/contact/">Contact Us</a>
          </li>
        </ul>
        <span class="navbar-text">
          <div class="loginlink" id="loginlogout">
          </div>
        </span>
      </div>
    </div>
  </nav>


  <section class="homepage-hero">
    <div class="homepage-hero-content">
      <h1 class="text-white fw-bold fs-1 hero-text">Welcome to our Dealerships!</h1>
      <a href="/dealers" class="btn" style="background-color:rgb(232, 245, 237);margin:10px; color:#333;">View
        Dealerships</a>
    </div>
  </section>
  </div>
</body>

</html>
