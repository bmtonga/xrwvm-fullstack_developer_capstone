<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Cars Dealerships</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script>

    const logout = async (event) => {
      event?.preventDefault();
      try {
        const res = await fetch(window.location.origin + "/djangoapp/logout", {
          method: "GET",
        });
        const json = await res.json();

        if (json) {
          sessionStorage.removeItem("username");
          window.location.href = window.location.origin;
        } else {
          alert("The user could not be logged out.");
        }
      } catch (error) {
        console.error("Logout error:", error);
        alert("An error occurred while logging out.");
      }
    };

    let checkSession = () => {
      let curr_user = sessionStorage.getItem("username");

      if (curr_user && curr_user !== "") {
        document.getElementById("loginlogout").innerHTML =
          '<span class="homepage_links">' + curr_user + '</span>' +
          '<a class="homepage_links" onclick="logout(event)" href="/">Logout</a>'
      } else {
        document.getElementById("loginlogout").innerHTML =
          '<a class="homepage_links" href="/login">Login</a>' +
          '<a class="homepage_links"  href="/register">Register</a>'
      }
    }
  </script>
</head>

<body onload="checkSession()">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <nav class="navbar navbar-expand-lg navbar-light site-navbar">
    <div class="container-fluid">
      <a href="/" class="logo">Dealerships</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/about/">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/contact/">Contact Us</a>
          </li>
        </ul>
        <div class="navbar-text">
          <div class="loginlink" id="loginlogout">
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main id="main-content">
    <section class="homepage-hero">
      <div class="homepage-hero-content">
        <h1 class="fw-bold fs-1 hero-text">Welcome to our Dealerships!</h1>
        <p class="homepage-hero-description">Explore new and pre-owned vehicles from trusted dealerships near you.</p>
        <a href="/dealers/" class="btn homepage-cta">View
          Dealerships</a>
      </div>
    </section>
  </main>
</body>

</html>
